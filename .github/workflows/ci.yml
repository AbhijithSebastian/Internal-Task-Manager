name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: taskmanager
          POSTGRES_DB: taskmanager_test
        options: >-
          --health-cmd pg_isready -U taskmanager
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lint
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=alembic,venv --ignore=E231,E203,W503

      - name: Run migrations
        run: |
          cp .env.example .env
          DATABASE_URL="postgresql+psycopg://taskmanager:taskmanager@localhost:5432/taskmanager_test"
          export DATABASE_URL
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://taskmanager:taskmanager@localhost:5432/taskmanager_test

      - name: Seed database
        run: |
          DATABASE_URL="postgresql+psycopg://taskmanager:taskmanager@localhost:5432/taskmanager_test"
          python -c "
          from app.database.seed import seed
          from app.core.database import SessionLocal
          db = SessionLocal()
          seed(db)
          db.close()
          "
        env:
          DATABASE_URL: postgresql+psycopg://taskmanager:taskmanager@localhost:5432/taskmanager_test

      - name: Run tests
        run: |
          python -m pytest app/tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql+psycopg://taskmanager:taskmanager@localhost:5432/taskmanager_test
          APP_ENV: test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Design token boundary
        run: npm run check:tokens

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose -f docker-compose.yml build
