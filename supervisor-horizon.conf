; =============================================================================
; Horizon Supervisor Configuration
; =============================================================================
; Place this file at: /etc/supervisor/conf.d/horizon.conf
;
; After placing, run:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start horizon:*
; =============================================================================

[program:horizon]
process_name=%(program_name)s
command=php /path/to/project/artisan horizon
autostart=true
autorestart=true
user=www-data                                ; TODO: Set your web server user
redirect_stderr=true
stdout_logfile=/path/to/project/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600                            ; Give Horizon 1 hour to finish jobs
stopasgroup=true
killasgroup=true
